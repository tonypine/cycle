name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to a pull request cancels its stale run. A push to main never cancels a running run,
# because each green one triggers a release (release.yml); runs on main go one at a time, in order.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Test the release scripts
        run: scripts/release/changelog_test.sh

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      # The runner image can lag behind compileSdk in gradle/libs.versions.toml; keep the two in step.
      - name: Install the Android SDK platform
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0"

      - name: Lint, test, verify screenshots and build
        run: ./gradlew ktlintCheck lint testDebugUnitTest verifyRoborazziDebug assembleDebug

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/outputs/roborazzi/
          if-no-files-found: ignore
