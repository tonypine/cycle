name: Release

# Every merge to main ships the signed Cycle and design-system catalog APKs on GitHub Releases once
# CI passes on that commit, then posts an update to the Linear initiative. See
# docs/decisions/0002-release-distribution.md.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Posts, or re-posts, the Linear update for an existing release, for when Linear was down or the
  # secret was missing. Builds and publishes nothing.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to post the Linear update for, for example v0.1.42
        required: true
        type: string

# Releases go out one after the other, in the order CI finishes on main, which is merge order. A
# manual Linear update has a group of its own, so it never replaces a release waiting in the queue.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('linear-update-{0}', inputs.tag) || 'release' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    # Only a green CI run for a push to main in this repository; a fork's branch named main does
    # not count.
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    # A release created with GITHUB_TOKEN does not trigger `on: release` workflows, so later jobs
    # read the release from these outputs.
    outputs:
      created: ${{ steps.publish.outputs.created }}
      version: ${{ steps.version.outputs.name }}
      version_code: ${{ steps.version.outputs.code }}
      tag: ${{ steps.version.outputs.tag }}
      release_url: ${{ steps.publish.outputs.release_url }}
      apk_url: ${{ steps.publish.outputs.apk_url }}
      catalog_apk_url: ${{ steps.publish.outputs.catalog_apk_url }}
      changelog: ${{ steps.changelog.outputs.changelog }}
    steps:
      - name: Check the signing secrets
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          missing=0
          for secret in RELEASE_KEYSTORE_BASE64 RELEASE_KEYSTORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -z "${!secret}" ]; then
              echo "::error title=Missing signing secret::The repository secret $secret is not set. Add it as described in README.md (Releases > One-time setup); no release was created."
              missing=1
            fi
          done
          exit "$missing"

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Compute the version
        id: version
        run: |
          code="$(git rev-list --count HEAD)"
          major_minor="$(sed -n 's/^cycle\.versionMajorMinor=\([0-9]*\.[0-9]*\)$/\1/p' gradle.properties)"
          if [ -z "$major_minor" ]; then
            echo "::error::Could not read cycle.versionMajorMinor from gradle.properties"
            exit 1
          fi
          name="$major_minor.$code"
          tag="v$name"

          # versionCode is the last part of every release tag; Android only updates to a higher one.
          for existing in $(git tag --list 'v*'); do
            existing_code="${existing##*.}"
            if [ "$existing" != "$tag" ] && [ "$existing_code" -ge "$code" ] 2>/dev/null; then
              echo "::error::versionCode $code is not greater than release $existing: a newer commit is already released, or main was rewritten"
              exit 1
            fi
          done

          echo "Releasing $tag (versionCode $code) from $(git rev-parse --short HEAD)"
          {
            echo "code=$code"
            echo "name=$name"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      # The runner image can lag behind compileSdk in gradle/libs.versions.toml; keep the two in step,
      # as in ci.yml.
      - name: Install the Android SDK platform
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0"

      - name: Decode the release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          keystore="$RUNNER_TEMP/cycle-release.jks"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          if [ ! -s "$keystore" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 did not decode to a keystore"
            exit 1
          fi
          echo "RELEASE_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

      # The app and the design-system catalog share the version and the release key, so both update
      # in place on the phone.
      - name: Build the signed release APKs
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          ./gradlew :app:assembleRelease :app-catalog:assembleRelease \
            "-Pcycle.versionCode=$VERSION_CODE" "-Pcycle.versionName=$VERSION_NAME"

      - name: Verify the APK signatures and versions
        id: apk
        env:
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"

          # verify <module> <package> <asset>: checks the module's release APK and copies it to
          # $RUNNER_TEMP/<asset>.
          verify() {
            local module="$1" package="$2" asset="$RUNNER_TEMP/$3"
            # A signed build writes <module>-release.apk; <module>-release-unsigned.apk means signing
            # was skipped.
            local apk="$module/build/outputs/apk/release/$module-release.apk"
            if [ ! -f "$apk" ]; then
              echo "::error::$apk is missing; never publish an unsigned APK"
              ls -l "$module/build/outputs/apk/release/" || true
              exit 1
            fi
            "$build_tools/apksigner" verify --verbose "$apk"

            local badging
            badging="$("$build_tools/aapt2" dump badging "$apk" | head -n 1)"
            echo "$badging"
            case "$badging" in
              "package: name='$package' versionCode='$VERSION_CODE' versionName='$VERSION_NAME' "*) ;;
              *)
                echo "::error::$apk is not package $package, versionCode $VERSION_CODE, versionName $VERSION_NAME"
                exit 1
                ;;
            esac
            cp "$apk" "$asset"
          }
          verify app com.tonypine.cycle "cycle-v$VERSION_NAME.apk"
          verify app-catalog com.tonypine.cycle.catalog "cycle-catalog-v$VERSION_NAME.apk"

          # Both must carry the one release certificate.
          certificate() { "$build_tools/apksigner" verify --print-certs "$1" | grep 'certificate SHA-256 digest'; }
          if [ "$(certificate "$RUNNER_TEMP/cycle-v$VERSION_NAME.apk")" != "$(certificate "$RUNNER_TEMP/cycle-catalog-v$VERSION_NAME.apk")" ]; then
            echo "::error::The app and the catalog APKs are signed with different certificates"
            exit 1
          fi

          {
            echo "app=$RUNNER_TEMP/cycle-v$VERSION_NAME.apk"
            echo "catalog=$RUNNER_TEMP/cycle-catalog-v$VERSION_NAME.apk"
          } >> "$GITHUB_OUTPUT"

      - name: Build the changelog
        id: changelog
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          scripts/release/changelog.sh HEAD > "$notes"
          cat "$notes"
          echo "path=$notes" >> "$GITHUB_OUTPUT"
          delimiter="changelog-$(openssl rand -hex 16)"
          {
            echo "changelog<<$delimiter"
            cat "$notes"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Publish the GitHub Release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          APK: ${{ steps.apk.outputs.app }}
          CATALOG_APK: ${{ steps.apk.outputs.catalog }}
          NOTES: ${{ steps.changelog.outputs.path }}
        run: |
          # Re-running the job for the same commit gives the same tag; keep the release it already made.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::notice::Release $TAG already exists; leaving it as it is"
            created=false
          else
            gh release create "$TAG" "$APK" "$CATALOG_APK" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$SHA" \
              --title "$TAG" \
              --notes-file "$NOTES" \
              --latest
            created=true
          fi
          release_url="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url)"
          download_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$TAG"
          echo "Published $release_url"
          {
            echo "created=$created"
            echo "release_url=$release_url"
            echo "apk_url=$download_url/$(basename "$APK")"
            echo "catalog_apk_url=$download_url/$(basename "$CATALOG_APK")"
          } >> "$GITHUB_OUTPUT"

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/cycle-release.jks"

  linear-update:
    needs: release
    # After a release this run created, or by hand for an existing tag. In its own job, a failed
    # Linear call fails here and leaves the published release as it is.
    if: >-
      !cancelled() && (
        github.event_name == 'workflow_dispatch' ||
        (needs.release.result == 'success' && needs.release.outputs.created == 'true')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: scripts/release

      # Both triggers read the published release the same way, so a manual re-post runs the code
      # every merge runs.
      - name: Read the release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release.outputs.tag }}
        run: |
          release="$RUNNER_TEMP/release.json"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,body,assets > "$release"; then
            echo "::error::There is no GitHub Release for tag '$TAG'"
            exit 1
          fi
          has_asset() { jq --exit-status --arg name "$1" 'any(.assets[]; .name == $name)' "$release" > /dev/null; }
          download_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$TAG"
          apk="cycle-$TAG.apk"
          if ! has_asset "$apk"; then
            echo "::error::Release $TAG has no APK asset $apk"
            exit 1
          fi
          # Releases from before the catalog shipped have no catalog APK; their update links the app only.
          catalog_apk="cycle-catalog-$TAG.apk"
          catalog_apk_url=""
          if has_asset "$catalog_apk"; then
            catalog_apk_url="$download_url/$catalog_apk"
          else
            echo "::notice::Release $TAG has no catalog APK $catalog_apk; the update links the app only"
          fi
          notes="$RUNNER_TEMP/release-notes.md"
          jq --raw-output .body "$release" > "$notes"
          {
            echo "tag=$TAG"
            echo "release_url=$(jq --raw-output .url "$release")"
            echo "apk_url=$download_url/$apk"
            echo "catalog_apk_url=$catalog_apk_url"
            echo "notes=$notes"
          } >> "$GITHUB_OUTPUT"

      - name: Post the Linear initiative update
        env:
          LINEAR_RELEASE_API_KEY: ${{ secrets.LINEAR_RELEASE_API_KEY }}
          LINEAR_INITIATIVE_ID: ${{ vars.LINEAR_INITIATIVE_ID }}
          TAG: ${{ steps.release.outputs.tag }}
          RELEASE_URL: ${{ steps.release.outputs.release_url }}
          APK_URL: ${{ steps.release.outputs.apk_url }}
          CATALOG_APK_URL: ${{ steps.release.outputs.catalog_apk_url }}
          NOTES: ${{ steps.release.outputs.notes }}
        run: |
          scripts/release/linear_update.sh body "$TAG" "$RELEASE_URL" "$APK_URL" "$CATALOG_APK_URL" "$NOTES"
          scripts/release/linear_update.sh post "$TAG" "$RELEASE_URL" "$APK_URL" "$CATALOG_APK_URL" "$NOTES"
