[versions]
androidGradlePlugin = "9.4.1"
kotlin = "2.4.20"
ktlintGradle = "14.2.0"
ktlint = "1.8.0"
roborazzi = "1.76.0"
robolectric = "4.17"
# The Android runtime Robolectric runs for `sdk` in build-logic/robolectric/robolectric.properties.
# Gradle resolves it (see RobolectricRuntime.kt), so it must match what this Robolectric version
# asks for: after bumping either, a failing test names the new one ("no artifacts found for ...").
robolectricAndroidAll = "16-robolectric-13921718-i7"
composeBom = "2026.09.00"
activityCompose = "1.13.0"
coreKtx = "1.19.1"
junit = "4.13.2"
graphicsShapes = "1.1.0"
androidxTestExtJunit = "1.3.0"
room = "2.8.5"
# KSP runs Room's annotation processor. Since 2.3.0 its version no longer follows Kotlin's.
ksp = "2.3.12"
datastore = "1.2.1"
# Matches the kotlinx-coroutines that Room and DataStore bring, so tests run the version that ships.
kotlinxCoroutines = "1.9.0"
navigationCompose = "2.10.2"
# What navigation-compose brings, so the app runs one lifecycle version.
lifecycle = "2.11.0"

# Android SDK levels and the JDK toolchain, read by the convention plugins in build-logic.
compileSdk = "37"
targetSdk = "37"
minSdk = "29"
jvmToolchain = "21"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-runtime = { module = "androidx.compose.runtime:runtime" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }
androidx-graphics-shapes = { module = "androidx.graphics:graphics-shapes", version.ref = "graphicsShapes" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-testing = { module = "androidx.room:room-testing", version.ref = "room" }
junit = { module = "junit:junit", version.ref = "junit" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
robolectric-android-all-instrumented = { module = "org.robolectric:android-all-instrumented", version.ref = "robolectricAndroidAll" }
roborazzi = { module = "io.github.takahirom.roborazzi:roborazzi", version.ref = "roborazzi" }
roborazzi-accessibility-check = { module = "io.github.takahirom.roborazzi:roborazzi-accessibility-check", version.ref = "roborazzi" }
roborazzi-compose = { module = "io.github.takahirom.roborazzi:roborazzi-compose", version.ref = "roborazzi" }
roborazzi-junit-rule = { module = "io.github.takahirom.roborazzi:roborazzi-junit-rule", version.ref = "roborazzi" }

# Plugin artifacts that build-logic compiles against.
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "androidGradlePlugin" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
compose-compiler-gradle-plugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
ktlint-gradle-plugin = { module = "org.jlleitschuh.gradle:ktlint-gradle", version.ref = "ktlintGradle" }
roborazzi-gradle-plugin = { module = "io.github.takahirom.roborazzi:roborazzi-gradle-plugin", version.ref = "roborazzi" }

[plugins]
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
android-library = { id = "com.android.library", version.ref = "androidGradlePlugin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room = { id = "androidx.room", version.ref = "room" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintGradle" }
roborazzi = { id = "io.github.takahirom.roborazzi", version.ref = "roborazzi" }

# Convention plugins from build-logic.
cycle-android-application = { id = "cycle.android.application" }
cycle-android-library = { id = "cycle.android.library" }
cycle-android-compose = { id = "cycle.android.compose" }
cycle-jvm-library = { id = "cycle.jvm.library" }
cycle-robolectric-tests = { id = "cycle.robolectric.tests" }
cycle-screenshot-tests = { id = "cycle.screenshot.tests" }
cycle-ktlint = { id = "cycle.ktlint" }
